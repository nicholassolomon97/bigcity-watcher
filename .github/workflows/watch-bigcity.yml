name: Watch Big City Volleyball
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Save rendered page text + screenshot as artifact"
        default: "0"
permissions:
  contents: write
concurrency:
  group: bigcity-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Playwright (with retry)
        run: |
          pip install playwright
          for i in 1 2 3; do
            timeout 180 playwright install --with-deps chromium && break
            echo "install attempt $i failed or timed out; retrying"; sleep 5
          done
      - name: Check
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          BCV_FILTER: ${{ vars.BCV_FILTER }}
          DEBUG: ${{ github.event.inputs.debug || '0' }}
        run: python check_bigcity.py
      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.debug == '1' }}
        with:
          name: debug
          path: |
            debug_page.txt
            debug_page.png
      - name: Commit state
        run: |
          git config user.name "bcv-watcher"; git config user.email "bcv-watcher@users.noreply.github.com"
          [ -f state_bigcity.json ] || { echo "no state file yet"; exit 0; }
          git add state_bigcity.json
          git diff --cached --quiet || (git commit -m "Update Big City state" && git push)
