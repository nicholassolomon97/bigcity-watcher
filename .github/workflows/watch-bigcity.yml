name: Watch Big City Volleyball
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Save rendered page text + screenshot as artifact"
        default: "0"
permissions:
  contents: write
concurrency:
  group: bigcity-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Playwright (no apt unless needed)
        run: |
          pip install playwright
          # The runner already has the browser's system libraries; only the Chromium download is needed.
          # (--with-deps also apt-installs fonts, which hangs on the Ubuntu mirror and isn't needed for text.)
          for i in 1 2 3; do
            timeout -k 10 120 playwright install chromium && break
            echo "browser download attempt $i failed or timed out; retrying"; sleep 5
          done
          launch_test='from playwright.sync_api import sync_playwright as s; p=s().start(); p.chromium.launch().close(); p.stop(); print("browser launch OK")'
          if ! python -c "$launch_test"; then
            echo "Browser failed to launch - installing system dependencies as a fallback"
            sudo pkill -9 apt-get || true; sudo pkill -9 dpkg || true; sudo dpkg --configure -a || true
            timeout -k 10 240 playwright install-deps chromium
            python -c "$launch_test"
          fi
      - name: Check
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          BCV_FILTER: ${{ vars.BCV_FILTER }}
          DEBUG: ${{ github.event.inputs.debug || '0' }}
        run: python check_bigcity.py
      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.debug == '1' }}
        with:
          name: debug
          path: |
            debug_page.txt
            debug_page.png
      - name: Commit state
        run: |
          git config user.name "bcv-watcher"; git config user.email "bcv-watcher@users.noreply.github.com"
          [ -f state_bigcity.json ] || { echo "no state file yet"; exit 0; }
          git add state_bigcity.json
          git diff --cached --quiet || (git commit -m "Update Big City state" && git push)
